name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # npm trusted publishing (OIDC) needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - name: Check tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          [ "$pkg" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $pkg"; exit 1; }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --access public
      - name: Publish page-harness-dsh
        working-directory: dsh-plugin
        run: |
          npm ci
          npm run check
          npm test
          ver="$(node -p "require('./package.json').version")"
          if npm view "page-harness-dsh@${ver}" version >/dev/null 2>&1; then
            echo "page-harness-dsh@${ver} is already on npm"
          else
            npm publish --access public
          fi
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  publish-dsh:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: dsh-plugin/package-lock.json
      - run: npm install -g npm@latest
      - name: Publish page-harness-dsh with trusted publishing
        working-directory: dsh-plugin
        run: |
          npm ci
          npm run check
          npm test
          npm publish --access public
